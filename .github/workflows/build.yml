name: Build MyBrothar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK (aapt2 + d8 + apksigner)
        run: bash scripts/build-apk.sh

      - name: Subir artefacto (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: mybrothar-apk
          path: dist/mybrothar.apk
          retention-days: 30

      - name: Publicar Release (enlace permanente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/mybrothar.apk \
            --title "MyBrothar — última versión" \
            --notes-file .github/release-notes.md \
            --latest
